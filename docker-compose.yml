services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes: 
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0" # Start Vite, bind to localhost
    ports:
      - "5173:5173"  # For Vite
    networks:
      - appnet
  api:
    image: node:20-alpine
    working_dir: /api
    volumes:
      - ./api:/api
    command: sh -c "npm install && npm run dev"
    ports:
      - "4000:4000"  # For GraphQL API
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=example
      - DB_NAME=projectdb
    depends_on:
      - db
    networks:
      - appnet
  db:
    image: mysql:8.3.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: projectdb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - appnet
volumes:
  db_data:
networks:
  appnet:
    driver: bridge
